name: Publish
on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  merge_group:
  workflow_dispatch:

jobs:
  publish:
    uses: linz/topo-workflows/.github/workflows/publish.yml@d83a20c83b5c6c740cad4a5c676b37e05a2bef99
    with:
      user_group: sea
      odr_bucket: s3://nz-coastal/
    secrets: inherit

  ci-ok:
    if: always()
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
