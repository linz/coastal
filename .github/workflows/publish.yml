name: Publish

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  workflow_dispatch:

concurrency:
  # Queue master branch, but let all other branch actions execute independently.
  group: ${{ github.ref == 'refs/heads/master' && 'publish-queue' || format('validate-{0}', github.run_id) }}
  queue: max

jobs:
  publish:
    uses: linz/topo-workflows/.github/workflows/publish.yml@master
    with:
      user_group: sea
      odr_bucket: s3://nz-coastal/
    secrets: inherit
